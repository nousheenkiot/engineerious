events {}

http {
    upstream finance-ui {
        server finance-ui:80;
    }

    upstream cohortservice {
        server cohortservice:8080;
    }

    upstream processingservice {
        server processingservice:8082 weight=90;
        server processingservice-canary:8082 weight=10;
    }

    upstream cashflowservice {
        server cashflowservice:8083;
    }

    upstream authservice {
        server authservice:8084;
    }

    server {
        listen 80;

        # Add custom headers for transparency (Transformation demo)
        add_header X-Gateway-Managed "true";

        # UI Route
        location / {
            proxy_pass http://finance-ui;
        }

        # API Routes - Cohort Service (Policies)
        location /finance/api/policies {
            proxy_request_buffering off;
            proxy_set_header X-Service-Origin "local-gateway";
            proxy_pass http://cohortservice;
        }

        # Auth Route
        location /finance/api/auth {
            proxy_pass http://authservice;
        }

        # API Routes - Cohort Service (Cashflows with Rewrite)
        # Demonstrates path transformation
        location /finance/api/cashflows {
            rewrite ^/finance/api/cashflows/(.*) /finance/api/cashflows/$1 break;
            proxy_pass http://cohortservice;
        }

        # API Routes - Processing Service (with Weighted Traffic)
        location /finance/api/processing {
            proxy_pass http://processingservice;
        }

        # API Routes - Cashflow Service (Direct)
        location /finance/api/cashflow-direct {
            proxy_pass http://cashflowservice;
        }

        # API Documentation (Developer Portal Integration)
        location /finance/docs {
            rewrite ^/finance/docs(.*) /finance/swagger-ui/index.html$1 break;
            proxy_pass http://cohortservice;
        }
    }
}
