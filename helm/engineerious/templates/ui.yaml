apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-ui
spec:
  replicas: {{ .Values.services.financeui.replicas }}
  selector:
    matchLabels:
      app: finance-ui
  template:
    metadata:
      labels:
        app: finance-ui
    spec:
      containers:
      - name: finance-ui
        {{- if .Values.images.registry }}
        image: "{{ .Values.images.registry }}/finance-ui:{{ .Values.images.tags.financeui }}"
        {{- else }}
        image: "finance-ui:{{ .Values.images.tags.financeui }}"
        {{- end }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: finance-ui
spec:
  selector:
    app: finance-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
