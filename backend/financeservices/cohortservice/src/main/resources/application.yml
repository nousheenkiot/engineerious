server:
  port: 8081
  servlet:
    context-path: /finance

spring:
  application:
    name: cohortservice
  cloud:
    kubernetes:
      config:
        enabled: true
        name: cohortservice
        sources:
          - name: finance-config
          - name: cohortservice
        reload:
          enabled: true
          strategy: refresh
          mode: event
      discovery:
        enabled: true
        all-namespaces: false
  config:
    import: "optional:kubernetes:"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      transaction-id-prefix: cohort-tx-
      acks: all # Wait for full set of in-sync replicas to acknowledge the record
      retries: 3 # Retry up to 3 times on retriable errors before failing
      properties:
        enable.idempotence: true # Ensures exactly-once semantics
        max.in.flight.requests.per.connection: 5 # Allows parallel sends while maintaining order if idempotence is true
        delivery.timeout.ms: 120000 # Wait up to 2 minutes for a successful delivery (including retries)
    consumer:
      group-id: cohort-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
      isolation-level: read_committed

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: ${JWT_SECRET:very-secret-key-that-should-be-at-least-thirty-two-characters-long}
