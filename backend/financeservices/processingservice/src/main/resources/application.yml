server:
  port: 8082
  servlet:
    context-path: /finance

spring:
  application:
    name: processingservice
  cloud:
    kubernetes:
      config:
        enabled: true
        name: processingservice
        sources:
          - name: finance-config
          - name: processingservice
        reload:
          enabled: true
          strategy: refresh
          mode: event
      discovery:
        enabled: true
        all-namespaces: false
  config:
    import: "optional:kubernetes:"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
